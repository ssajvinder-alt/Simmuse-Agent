name: Simmuse Installers

# Builds downloadable desktop installers from this repository's own code and
# attaches them to a GitHub release, so https://simmuse.pro can link to them.
#
# Run it by hand: Actions -> "Simmuse Installers" -> Run workflow, and give a
# release tag such as v0.1.0. It creates the tag and a PRE-RELEASE with the
# files attached. Review the pre-release, then publish it from the Releases page.
#
# These builds are UNSIGNED. They need no Apple, Azure or Cloudflare accounts:
#   - macOS: DMG + ZIP, for Apple silicon and Intel Macs. First launch needs right-click -> Open (Gatekeeper).
#   - Linux: AppImage.
#   - Windows: sideload MSIX. An unsigned MSIX will not install until it is
#     signed with a certificate the user trusts, so this job is best-effort
#     and never blocks the macOS and Linux files.
# Signed and notarized releases use desktop-bundled-release.yml, which needs
# the project's signing and storage secrets.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create, for example v0.1.0
        required: true
        type: string
      platforms:
        description: 'Which installers to build now: all, or a comma list of mac-arm, mac-intel, linux, windows (use none to only publish)'
        required: false
        default: all
        type: string
      reuse_run_id:
        description: 'Optional: id of an earlier run of this workflow whose finished installers are added to the release instead of rebuilding them'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: simmuse-installers-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan builds
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - id: plan
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          all='[
            {"key":"mac-arm","name":"macOS (Apple silicon)","os":"macos-15","shell":"bash","best-effort":false},
            {"key":"mac-intel","name":"macOS (Intel)","os":"macos-15-intel","shell":"bash","best-effort":false},
            {"key":"linux","name":"Linux (x64)","os":"ubuntu-24.04","shell":"bash","best-effort":false},
            {"key":"windows","name":"Windows (x64)","os":"windows-2022","shell":"pwsh","best-effort":true}
          ]'
          want=$(printf '%s' "${PLATFORMS:-all}" | tr -d ' ')
          if [ "$want" = all ]; then
            matrix=$(jq -c '{include: .}' <<<"$all")
          else
            matrix=$(jq -c --arg want ",$want," '{include: [.[] | . as $e | select($want | contains("," + $e.key + ","))]}' <<<"$all")
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.include | length' <<<"$matrix")" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: plan
    if: ${{ needs.plan.outputs.count != '0' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 200
    continue-on-error: ${{ matrix.best-effort }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out the code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # A build can fail for reasons that have nothing to do with the code (a dropped
      # download, a flaky runner). Try twice from a clean output folder before giving up.
      - name: Build installers (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for attempt in 1 2; do
            rm -rf apps/desktop/release
            if scripts/build-bundle.sh; then exit 0; fi
            echo "::warning::build attempt $attempt failed"
          done
          echo "::error::build failed twice"; exit 1

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($attempt in 1..2) {
            if (Test-Path apps\desktop\release) { Remove-Item -Recurse -Force apps\desktop\release }
            scripts\build-bundle.ps1
            if ($LASTEXITCODE -eq 0 -and $?) { exit 0 }
            Write-Host "::warning::build attempt $attempt failed"
          }
          Write-Host "::error::build failed twice"; exit 1

      # Refuse to publish an installer that is missing or implausibly small.
      - name: Check the installers look sane
        shell: bash
        env:
          OS_NAME: ${{ runner.os }}
        run: |
          cd apps/desktop/release
          case "$OS_NAME" in
            macOS)   need='*.dmg *.zip' ;;
            Linux)   need='*.AppImage' ;;
            Windows) need='*.msix' ;;
          esac
          for pattern in $need; do
            files=$(ls $pattern 2>/dev/null || true)
            [ -n "$files" ] || { echo "::error::no $pattern was produced"; exit 1; }
            for f in $files; do
              size=$(stat -c %s "$f" 2>/dev/null || stat -f %z "$f")
              echo "$f $size bytes"
              [ "$size" -gt 100000000 ] || { echo "::error::$f is only $size bytes"; exit 1; }
            done
          done

      - name: Upload installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.msix
            apps/desktop/release/*.msixbundle
          if-no-files-found: error

  release:
    name: Create pre-release
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.build.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download installers built in this run
        if: ${{ needs.build.result != 'skipped' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true

      - name: Download installers from an earlier run
        if: ${{ inputs.reuse_run_id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
          run-id: ${{ inputs.reuse_run_id }}
          github-token: ${{ github.token }}

      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$TAG" in v[0-9]*) ;; *) echo "tag must look like v0.1.0" >&2; exit 1 ;; esac
          [ -d installers ] && [ -n "$(ls -A installers)" ] || { echo "no installer files were built" >&2; exit 1; }
          # GitHub rejects any single release file of 2 GiB or more. Those files stay
          # available as workflow artifacts and are named in the release notes.
          limit=2147483648
          mkdir -p too-big
          for f in installers/*; do
            if [ "$(stat -c %s "$f")" -ge "$limit" ]; then mv "$f" too-big/; fi
          done
          [ -n "$(ls -A installers)" ] || { echo "every installer is over the 2 GiB release-file limit" >&2; exit 1; }
          (cd installers && sha256sum * > SHA256SUMS.txt)
          ls -lh installers too-big
          notes="Unsigned pre-release build of Simmuse for testing. See TESTER_GUIDE.md.

          - macOS: open the DMG, then right-click the app and choose Open on first launch (Gatekeeper).
          - Linux: make the AppImage executable and run it.
          - Verify downloads against SHA256SUMS.txt."
          if [ -n "$(ls -A too-big)" ]; then
            notes="$notes

          Not attached because GitHub limits release files to under 2 GiB: $(ls too-big | tr '\n' ' '). Ask the maintainer for a copy, or build it from source."
          fi
          # Say which platforms are missing so nobody is surprised.
          missing=""
          ls installers | grep -q 'mac-arm64.*\.dmg$' || missing="$missing macOS-Apple-silicon"
          ls installers | grep -q 'mac-x64.*\.dmg$'   || missing="$missing macOS-Intel"
          ls installers | grep -q '\.AppImage$'       || missing="$missing Linux"
          if [ -n "$missing" ]; then
            notes="$notes

          Missing from this release (the build did not produce them):$missing"
          fi
          retry() { for n in 1 2 3; do "$@" && return 0; echo "retry $n: $*" >&2; sleep 20; done; return 1; }
          # Build the release as a hidden draft, attach every file (retrying), and only
          # then publish it, so a half-uploaded release is never visible.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$TARGET" \
              --draft --prerelease --title "Simmuse $TAG" --notes "$notes"
          fi
          retry gh release upload "$TAG" installers/* --clobber --repo "$GITHUB_REPOSITORY"
          # Confirm every file really arrived.
          uploaded=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)
          expected=$(ls installers | sort)
          [ "$uploaded" = "$expected" ] || { echo "::error::release assets do not match what was built"; diff <(echo "$expected") <(echo "$uploaded") || true; exit 1; }
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease \
            --title "Simmuse $TAG" --notes "$notes"
