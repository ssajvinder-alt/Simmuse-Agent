name: Deploy Docs (GitHub Pages)

# Builds the Docusaurus site and publishes it to GitHub Pages at
# https://<owner>.github.io/Simmuse-Agent/docs/. Needs no secrets: enable it once
# under Settings > Pages > Source: "GitHub Actions". The upstream-only
# deploy-site.yml job (GitHub App token, Vercel hook) is left untouched.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-simmuse
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      # Turns Pages on (source: GitHub Actions) if it is off. The default token may not be
      # allowed to; then enable it once under Settings > Pages and rerun this workflow.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        continue-on-error: true
        with:
          enablement: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 7.0.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: website

      - name: Build Docusaurus
        run: npm run build
        working-directory: website

      - name: Stage site (docs under /docs/, root redirects to it)
        run: |
          mkdir -p _site/docs
          cp -r website/build/* _site/docs/
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=docs/"><link rel="canonical" href="docs/"><a href="docs/">Simmuse Agent documentation</a>\n' > _site/index.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
